name: Test Career Eleven
on:
  push:
    branches: [main]
  # Keep PR validation enabled so deployment-infrastructure changes can be verified before merge.
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Run tests
        run: |
          if ! npm test > /tmp/career-eleven-tests.log 2>&1; then
            echo "Test suite failed. Showing final 160 lines:"
            tail -n 160 /tmp/career-eleven-tests.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: production-static
          path: dist/index.html
          if-no-files-found: error
      - name: Publish verified production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          cp dist/index.html /tmp/career-eleven-index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan production-publish
          git rm -rf .
          git clean -fdx
          cp /tmp/career-eleven-index.html index.html
          printf '%s\n' "$BUILD_SHA" > BUILD_SHA
          git add index.html BUILD_SHA
          git commit -m "deploy: ${BUILD_SHA}"
          git push --force origin HEAD:production
