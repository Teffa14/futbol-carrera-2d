name: Smoke check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check data.js
          node --check engine.js
