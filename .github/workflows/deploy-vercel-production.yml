name: Deploy Career Eleven to Vercel

# Deploy only the artifact that passed the main test workflow. This prevents a
# second build from racing the verified production artifact or publishing an
# empty CLI workspace.
on:
  workflow_run:
    workflows:
      - Test Career Eleven
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: career-eleven-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: team_Ch0YhVIbdeOyZrb6zKrdYYWC
      VERCEL_PROJECT_ID: prj_IBNlWUiiTAcv30ZZ8lfhaV22Ejd9
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PRODUCTION_URL: https://futbol-carrera-2d.vercel.app

    steps:
      - name: Require Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured for this repository." >&2
            exit 1
          fi

      - name: Download verified production artifact
        uses: actions/download-artifact@v4
        with:
          name: production-static
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate artifact before upload
        shell: bash
        run: |
          test -s dist/index.html
          BYTES="$(wc -c < dist/index.html)"
          if [ "$BYTES" -lt 100000 ] || [ "$BYTES" -ge 26214400 ]; then
            echo "Refusing to deploy suspicious artifact size: ${BYTES} bytes." >&2
            exit 1
          fi
          if grep -Eqi 'raw\.githubusercontent\.com/Teffa14|github\.com/Teffa14|api\.github\.com/repos/Teffa14|Teffa14/futbol-carrera-2d' dist/index.html; then
            echo "Production artifact leaks the source repository." >&2
            exit 1
          fi
          echo "Verified ${BYTES}-byte production artifact from workflow run ${{ github.event.workflow_run.id }}."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bind exact Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<JSON
          {"orgId":"$VERCEL_ORG_ID","projectId":"$VERCEL_PROJECT_ID","projectName":"futbol-carrera-2d"}
          JSON

      - name: Prepare static Build Output API payload
        shell: bash
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp dist/index.html .vercel/output/static/index.html
          node <<'NODE'
          const fs = require('node:fs');
          const headers = {
            'Cache-Control': 'no-store, max-age=0, must-revalidate',
            'CDN-Cache-Control': 'no-store',
            'Vercel-CDN-Cache-Control': 'no-store',
            'X-Content-Type-Options': 'nosniff',
            'Referrer-Policy': 'strict-origin-when-cross-origin',
            'Permissions-Policy': 'camera=(), microphone=(), geolocation=()'
          };
          fs.writeFileSync('.vercel/output/config.json', JSON.stringify({
            version: 3,
            routes: [
              {src: '^/(.*)$', headers, dest: '/index.html'}
            ]
          }));
          NODE
          test -s .vercel/output/static/index.html
          test -s .vercel/output/config.json
          test "$(wc -c < .vercel/output/static/index.html)" -eq "$(wc -c < dist/index.html)"

      - name: Deploy verified artifact to production
        id: deploy
        shell: bash
        run: |
          DEPLOYMENT_URL="$(npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          DEPLOYMENT_URL="$(printf '%s\n' "$DEPLOYMENT_URL" | tail -n 1 | tr -d '\r')"
          case "$DEPLOYMENT_URL" in
            https://*.vercel.app) ;;
            *)
              echo "Vercel did not return a deployment URL: $DEPLOYMENT_URL" >&2
              exit 1
              ;;
          esac
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Created $DEPLOYMENT_URL"

      - name: Verify deployment and production alias byte-for-byte
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          EXPECTED_SHA="$(sha256sum dist/index.html | awk '{print $1}')"
          verify_url() {
            local url="$1"
            local output="$2"
            local actual_sha=""
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error --location --max-time 20 "$url/" -o "$output"; then
                actual_sha="$(sha256sum "$output" | awk '{print $1}')"
                if [ "$actual_sha" = "$EXPECTED_SHA" ]; then
                  echo "Verified $url"
                  return 0
                fi
              fi
              sleep 3
            done
            echo "Production verification failed for $url" >&2
            echo "Expected SHA-256: $EXPECTED_SHA" >&2
            echo "Received SHA-256: ${actual_sha:-unavailable}" >&2
            return 1
          }
          verify_url "$DEPLOYMENT_URL" /tmp/deployment.html
          verify_url "$PRODUCTION_URL" /tmp/production.html
