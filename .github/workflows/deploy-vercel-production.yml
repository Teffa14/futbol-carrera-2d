name: Deploy Career Eleven to Vercel

# Production deploy trigger. Keep this workflow on main so every later main push can publish the verified static artifact.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career-eleven-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_Ch0YhVIbdeOyZrb6zKrdYYWC
      VERCEL_PROJECT_ID: prj_IBNlWUiiTAcv30ZZ8lfhaV22Ejd9
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require Vercel credential
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured for this repository." >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build self-contained production artifact
        run: npm run build

      - name: Verify public artifact is source-repository blind
        shell: bash
        run: |
          test -s dist/index.html
          test "$(wc -c < dist/index.html)" -lt 26214400
          if grep -Eqi 'raw\.githubusercontent\.com/Teffa14|github\.com/Teffa14|api\.github\.com/repos/Teffa14|Teffa14/futbol-carrera-2d' dist/index.html; then
            echo "Production artifact leaks the source repository." >&2
            exit 1
          fi

      - name: Link exact Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<JSON
          {"orgId":"$VERCEL_ORG_ID","projectId":"$VERCEL_PROJECT_ID","projectName":"futbol-carrera-2d"}
          JSON

      - name: Prepare static Build Output API payload
        shell: bash
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp dist/index.html .vercel/output/static/index.html
          node <<'NODE'
          const fs = require('node:fs');
          const headers = {
            'Cache-Control': 'no-store, max-age=0, must-revalidate',
            'CDN-Cache-Control': 'no-store',
            'Vercel-CDN-Cache-Control': 'no-store',
            'X-Content-Type-Options': 'nosniff',
            'Referrer-Policy': 'strict-origin-when-cross-origin',
            'Permissions-Policy': 'camera=(), microphone=(), geolocation=()'
          };
          const config = {
            version: 3,
            routes: [
              {src: '^/(.*)$', headers, dest: '/index.html'}
            ]
          };
          fs.writeFileSync('.vercel/output/config.json', JSON.stringify(config));
          NODE
          test -s .vercel/output/static/index.html
          test -s .vercel/output/config.json
          test ! -d .vercel/output/functions

      - name: Deploy static output to production
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
