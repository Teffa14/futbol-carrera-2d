name: Apply Argentina football overhaul

on:
  push:
    branches: [feature/argentina-football-overhaul]
    paths:
      - scripts/apply-argentina-overhaul.mjs
      - .github/workflows/apply-argentina-overhaul.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'remove migration helper') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source migration
        run: node scripts/apply-argentina-overhaul.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- career.js character-creation-v1.js career-development.js precareer-growth-v1.js precareer-entry-ui-v2.js football-rules-v2.js striker-intelligence-v3.js carry-intelligence-v1.js index.html package.json
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "feat: apply Argentina football core overhaul"
          git push origin HEAD:feature/argentina-football-overhaul
