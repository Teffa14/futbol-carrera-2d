<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07110c" />
  <meta name="description" content="Career Eleven 2D: modo carrera de jugador con partidos 11v11 autoplay, entrenamiento simulado, memoria táctica, builds y ligas asíncronas." />
  <title>Career Eleven 2D</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./character-creation.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    try {
      const key='career-eleven-2d:v4';
      const raw=localStorage.getItem(key);
      if(raw){
        const save=JSON.parse(raw);
        const clubCount=save?.world?Object.keys(save.world).length:0;
        if(clubCount>0&&clubCount<=6)localStorage.removeItem(key);
      }
    } catch {}
  </script>
  <script type="module">
    import './kick-direction.js';
    import './ball-priority.js';
    import './anti-cluster.js';
    import './positional-ai.js';
    import './boundary-intelligence.js';
    import './role-depth.js';
    import './kit-contrast.js';
    import './match-presentation.js';
    import './football-rules-v2.js';
    import './locomotion-v2.js';
    import './carry-intelligence-v1.js';
    import './agent-brain-v2.js';
    import './passing-intelligence-v2.js';
    import './striker-intelligence-v3.js';
    import './trajectory-intelligence-v1.js';
    import './coach-adjustments-v1.js';
    import './coach-substitutions-v1.js';
    import './match-substitutions-v1.js';
    import './match-tactical-state-v1.js';
    import './combination-play-v1.js';
    import './app.js';
    import './career-experience-ui-v1.js';
    import './training-intelligence-v7.js';
    import './training-live-ui-v4.js';
  </script>
</body>
</html>
