<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07110c" />
  <meta name="description" content="Career Eleven 2D: modo carrera de jugador con partidos 11v11 autoplay, builds, habilidades y ligas asíncronas." />
  <title>Career Eleven 2D</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    try {
      const key='career-eleven-2d:v4';
      const raw=localStorage.getItem(key);
      if(raw){
        const save=JSON.parse(raw);
        const clubCount=save?.world?Object.keys(save.world).length:0;
        if(clubCount>0&&clubCount<=6)localStorage.removeItem(key);
      }
    } catch {}
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
